name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Unit tests only. The live suite is opt-in: it would put pointless load on
      # Metacritic on every push, from shared runner addresses many other
      # projects also use. The nightly canary covers the live contract instead.
      - run: npm test
      - run: npm run build
