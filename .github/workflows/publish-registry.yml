name: Publish to MCP registry

# Runs after the npm publish, because the registry rejects a server.json whose
# version is not already on npm. Also dispatchable, to catch up a version whose
# registry entry was missed.
on:
  workflow_run:
    workflows: ["Publish"]
    types: [completed]
  workflow_dispatch:

jobs:
  registry:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read
      # The registry trusts this repository's OIDC identity, which is what
      # replaces the interactive device-code login.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/').tar.gz" \
            | tar xz mcp-publisher
          sudo mv mcp-publisher /usr/local/bin/
      - run: mcp-publisher login github-oidc
      # Same reason as the npm step: a tag can be recreated, and the registry
      # rejects a duplicate version rather than treating it as a no-op.
      - name: Publish unless the registry already has this version
        run: |
          name=$(node -p "require('./server.json').name")
          version=$(node -p "require('./server.json').version")
          published=$(curl -sf "https://registry.modelcontextprotocol.io/v0/servers?search=$name" \
            | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).servers.map(r => (r.server||r).version).join(' ')")
          if echo " $published " | grep -q " $version "; then
            echo "The registry already serves $name $version; nothing to publish."
          else
            mcp-publisher publish
          fi
